name: Update Running PBs

on:
  schedule:
    # 11:17 UTC daily (~7am ET). Off-the-hour to avoid GH cron congestion.
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pbs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cache Garmin OAuth tokens between runs so we don't password-login every day
      # (avoids the 429 rate limits the Vercel function was hitting).
      - name: Restore Garmin token cache
        id: garmin-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v1-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-v1-

      - name: Fetch PBs from Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch_pbs.py

      # Re-save the cache every run so refreshed OAuth2 tokens persist. The
      # cache action only saves on cache miss, so we save explicitly here.
      - name: Save Garmin token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v1-${{ github.run_id }}

      - name: Commit updated PBs
        run: |
          if [[ -n "$(git status --porcelain data/pbs.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pbs.json
            git commit -m "chore: update running PBs from Garmin"
            git push
          else
            echo "No changes to data/pbs.json."
          fi
